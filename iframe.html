<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Paypage v2 – Iframe Demo</title>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        "Helvetica Neue", Arial, sans-serif;
      background: linear-gradient(160deg, #0f172a 0%, #1e3a5f 50%, #0f766e 100%);
      color: #1f2937;
    }

    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header.topbar {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      padding: 16px 24px;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(8px);
      color: #fff;
      border-bottom: 1px solid rgba(255, 255, 255, 0.15);
    }

    .topbar h1 {
      font-size: 16px;
      font-weight: 600;
      margin: 0 0 4px;
      letter-spacing: 0.2px;
    }

    .topbar .hint {
      font-size: 12px;
      opacity: 0.8;
      margin: 0;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      flex: 1;
      justify-content: flex-end;
      min-width: 280px;
    }

    .controls label {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 11px;
      opacity: 0.9;
    }

    .controls select,
    .controls input {
      appearance: none;
      border: 1px solid rgba(255, 255, 255, 0.35);
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
      font-size: 13px;
      padding: 8px 12px;
      border-radius: 8px;
      outline: none;
    }

    .controls select option {
      color: #111;
    }

    .controls input {
      width: min(360px, 50vw);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    .controls input::placeholder {
      color: rgba(255, 255, 255, 0.5);
    }

    .controls label.checkbox {
      flex-direction: row;
      align-items: center;
      gap: 8px;
      align-self: flex-end;
      padding: 8px 0;
      cursor: pointer;
      user-select: none;
    }

    .controls label.checkbox input {
      width: auto;
      appearance: auto;
      margin: 0;
      cursor: pointer;
    }

    .controls button,
    .controls a {
      appearance: none;
      border: 1px solid rgba(255, 255, 255, 0.35);
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
      font-size: 13px;
      font-weight: 500;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.15s ease, transform 0.05s ease;
      align-self: flex-end;
    }

    .controls button.primary {
      background: #14b8a6;
      border-color: #14b8a6;
      color: #042f2e;
      font-weight: 600;
    }

    .controls button:hover,
    .controls a:hover {
      background: rgba(255, 255, 255, 0.22);
    }

    .controls button.primary:hover {
      background: #2dd4bf;
    }

    .controls button:active {
      transform: scale(0.97);
    }

    main.frame-wrap {
      flex: 1;
      padding: 24px;
      display: flex;
      justify-content: center;
      align-items: stretch;
    }

    .frame-card {
      flex: 1;
      max-width: 1200px;
      background: #fff;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
      position: relative;
      display: flex;
      flex-direction: column;
    }

    .loader {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      gap: 14px;
      align-items: center;
      justify-content: center;
      background: #fff;
      z-index: 2;
      transition: opacity 0.25s ease, visibility 0.25s ease;
    }

    .loader.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .spinner {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 3px solid #e5e7eb;
      border-top-color: #0f766e;
      animation: spin 0.9s linear infinite;
    }

    .loader span {
      font-size: 14px;
      color: #4b5563;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    iframe {
      flex: 1 1 auto;
      width: 100%;
      height: 75vh;
      border: 0;
      display: block;
      min-height: 640px;
      background: #fff;
    }

    footer.statusbar {
      padding: 10px 24px;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.85);
      text-align: center;
      background: rgba(0, 0, 0, 0.15);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      word-break: break-all;
    }

    @media (max-width: 720px) {
      header.topbar {
        flex-direction: column;
        align-items: stretch;
      }

      .controls {
        justify-content: stretch;
      }

      .controls input {
        width: 100%;
      }

      main.frame-wrap {
        padding: 12px;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="topbar">
      <div>
        <h1>Paypage v2 · Iframe Demo</h1>
        <p class="hint">Embeds the hosted payment page inside a merchant iframe</p>
      </div>
      <form class="controls" id="loadForm">
        <label>
          Environment
          <select id="envSelect" name="env">
            <option value="http://10.125.131.29:8080/" id="localEnvOption">Local</option>
            <option value="https://paypage-dev.platform.network.ae/v2/">Dev v2</option>
            <option value="https://paypage-sandbox.platform.network.ae/v2/">Sandbox v2</option>
            <option value="https://paypage.platform.network.ae/v2/">Production v2</option>
            <option value="https://paypage-dev.platform.network.ae/">Dev classic</option>
            <option value="https://paypage-sandbox.platform.network.ae/">Sandbox classic</option>
            <option value="https://paypage-dev.ngenius-payments.com/">Dev classic (ngenius)</option>
            <option value="https://paypage.sandbox.ngenius-payments.com/">Sandbox classic (ngenius)</option>
          </select>
        </label>
        <label>
          Payment code or full URL
          <input
            id="codeInput"
            name="code"
            type="text"
            placeholder="e.g. 4651c7c739aa59fb or full /v2?code=…"
            autocomplete="off"
            spellcheck="false"
          />
        </label>
        <label class="checkbox" title="Toggle iframe allow=&quot;payment *;&quot;">
          <input id="allowPayment" name="allowPayment" type="checkbox" checked />
          allow payment
        </label>
        <button class="primary" type="submit">Load in iframe</button>
        <button id="reloadBtn" type="button" title="Reload iframe">Reload</button>
        <a id="openBtn" href="#" target="_blank" rel="noopener noreferrer">Open tab</a>
      </form>
    </header>

    <main class="frame-wrap">
      <div class="frame-card">
        <div class="loader" id="loader">
          <div class="spinner" aria-hidden="true"></div>
          <span id="loaderText">Enter a payment code and click Load</span>
        </div>
        <iframe
          id="paymentFrame"
          title="Paypage"
          allow="payment *;"

        ></iframe>
      </div>
    </main>

    <footer class="statusbar" id="statusbar">Waiting for payment code…</footer>
  </div>

  <script>
    (function () {
      const iframe = document.getElementById('paymentFrame');
      const loader = document.getElementById('loader');
      const loaderText = document.getElementById('loaderText');
      const status = document.getElementById('statusbar');
      const envSelect = document.getElementById('envSelect');
      const codeInput = document.getElementById('codeInput');
      const allowPayment = document.getElementById('allowPayment');
      const loadForm = document.getElementById('loadForm');
      const reloadBtn = document.getElementById('reloadBtn');
      const openBtn = document.getElementById('openBtn');

      (function syncLocalEnvIp() {
        const localOpt = document.getElementById('localEnvOption');
        if (!localOpt) return;
        const host = location.hostname;
        const localHost =
          host && host !== 'localhost' && host !== '127.0.0.1' ? host : '10.125.131.29';
        localOpt.value = 'http://' + localHost + ':8080/';
        localOpt.textContent = 'Local (' + localHost + ':8080)';
      })();

      const params = new URLSearchParams(window.location.search);
      const initialCode = params.get('code') || '';
      const initialEnv = params.get('env');
      const initialAllow = params.get('allowPayment');
      if (initialCode) codeInput.value = initialCode;
      if (initialEnv) {
        const match = Array.from(envSelect.options).find(function (o) {
          return (
            o.value.indexOf(initialEnv) !== -1 ||
            o.textContent.toLowerCase() === initialEnv.toLowerCase()
          );
        });
        if (match) envSelect.value = match.value;
      }
      if (initialAllow === '0' || initialAllow === 'false') {
        allowPayment.checked = false;
      } else if (initialAllow === '1' || initialAllow === 'true') {
        allowPayment.checked = true;
      }

      let currentUrl = '';

      function applyAllowPayment() {
        if (allowPayment.checked) {
          iframe.setAttribute('allow', 'payment *;');
        } else {
          iframe.removeAttribute('allow');
        }
      }

      function allowPaymentLabel() {
        return allowPayment.checked ? 'allow="payment *;"' : 'allow removed';
      }

      function buildUrl(raw) {
        const value = (raw || '').trim();
        if (!value) return '';
        if (/^https?:\/\//i.test(value)) return value;
        let base = envSelect.value;
        if (!base.endsWith('/')) base += '/';
        const code = value.replace(/^\?code=/, '').replace(/^code=/, '');
        return base + '?code=' + encodeURIComponent(code);
      }

      function syncQuery(url) {
        try {
          const next = new URL(window.location.href);
          const u = new URL(url);
          const code = u.searchParams.get('code');
          if (code) next.searchParams.set('code', code);
          next.searchParams.set('allowPayment', allowPayment.checked ? '1' : '0');
          if (
            u.port === '8080' ||
            u.port === '8081' ||
            u.hostname === 'localhost' ||
            u.hostname === '127.0.0.1'
          ) {
            next.searchParams.set('env', 'local');
          } else if (u.pathname.indexOf('/v2') === 0) {
            next.searchParams.set(
              'env',
              u.hostname.indexOf('sandbox') !== -1
                ? 'sandbox'
                : u.hostname.indexOf('dev') !== -1
                  ? 'dev'
                  : 'production'
            );
          } else if (u.hostname.indexOf('sandbox') !== -1) {
            next.searchParams.set('env', 'sandbox-classic');
          } else if (u.hostname.indexOf('dev') !== -1) {
            next.searchParams.set('env', 'dev-classic');
          } else {
            next.searchParams.set('env', 'production');
          }
          history.replaceState(null, '', next.toString());
        } catch (e) {}
      }

      function loadFrame(url) {
        if (!url) {
          status.textContent = 'Enter a payment code or full paypage URL';
          return;
        }
        currentUrl = url;
        openBtn.href = url;
        applyAllowPayment();
        loader.classList.remove('hidden');
        loaderText.textContent = 'Loading paypage…';
        status.textContent = 'Loading · ' + url + ' · ' + allowPaymentLabel();
        iframe.src = url;
        syncQuery(url);
      }

      iframe.addEventListener('load', function () {
        if (!currentUrl) return;
        loader.classList.add('hidden');
        status.textContent =
          'Loaded · ' +
          currentUrl +
          ' · ' +
          allowPaymentLabel() +
          ' · ' +
          new Date().toLocaleTimeString();
      });

      allowPayment.addEventListener('change', function () {
        applyAllowPayment();
        try {
          const next = new URL(window.location.href);
          next.searchParams.set('allowPayment', allowPayment.checked ? '1' : '0');
          history.replaceState(null, '', next.toString());
        } catch (e) {}
        if (!currentUrl) {
          status.textContent = allowPaymentLabel();
          return;
        }
        loader.classList.remove('hidden');
        loaderText.textContent = 'Reloading with ' + allowPaymentLabel() + '…';
        status.textContent = 'Reloading · ' + currentUrl + ' · ' + allowPaymentLabel();
        iframe.src = currentUrl;
      });

      loadForm.addEventListener('submit', function (e) {
        e.preventDefault();
        loadFrame(buildUrl(codeInput.value));
      });

      reloadBtn.addEventListener('click', function () {
        if (!currentUrl) {
          loadFrame(buildUrl(codeInput.value));
          return;
        }
        applyAllowPayment();
        loader.classList.remove('hidden');
        loaderText.textContent = 'Reloading…';
        status.textContent = 'Reloading… · ' + allowPaymentLabel();
        iframe.src = currentUrl;
      });

      applyAllowPayment();

      if (initialCode) {
        loadFrame(buildUrl(initialCode));
      }
    })();
  </script>
</body>
</html>
